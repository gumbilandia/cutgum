<style>
:root {
  --bg: #0a0b10;
  --bg-elevated: #12141c;
  --bg-card: #171a24;
  --accent: #ffcc00;
  --accent-2: #ff5e3a;
  --text: #f4f5f7;
  --text-muted: #9aa0ae;
  --border: rgba(255, 255, 255, 0.08);
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
}

body {
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
  text-decoration: none;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
img {
  max-width: 100%;
  display: block;
}

::-webkit-scrollbar {
  height: 8px;
  width: 8px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #2b2f3a;
  border-radius: 999px;
}
::-webkit-scrollbar-thumb:hover {
  background: #3a3f4d;
}

.hidden {
  display: none !important;
}
.muted {
  color: var(--text-muted);
}
.small {
  font-size: 0.8rem;
}
.white {
  color: #fff;
}
.accent-text {
  color: var(--accent);
}

.page {
  min-height: 100vh;
  padding-bottom: 4rem;
}

.container {
  max-width: 1600px;
  margin: 0 auto;
  padding: 0 1rem;
}
@media (min-width: 640px) {
  .container {
    padding: 0 1.5rem;
  }
}

.main-stack {
  display: flex;
  flex-direction: column;
  gap: 2rem;
  padding-top: 1.5rem;
}

/* ---------------- Header ---------------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 40;
  border-bottom: 1px solid var(--border);
  background: rgba(10, 11, 16, 0.9);
  backdrop-filter: blur(10px);
}
.site-header-inner {
  max-width: 1600px;
  margin: 0 auto;
  height: 64px;
  padding: 0 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
@media (min-width: 640px) {
  .site-header-inner {
    padding: 0 1.5rem;
  }
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-shrink: 0;
}
.brand-mark {
  display: grid;
  place-items: center;
  height: 36px;
  width: 36px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #000;
  font-weight: 900;
  font-size: 1.1rem;
}
.brand-name {
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
}
.navpill {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  padding: 0.25rem;
}
.navlink {
  border-radius: 999px;
  padding: 0.5rem 1rem;
  font-size: 0.875rem;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.7);
  white-space: nowrap;
  transition: 0.15s;
}
@media (max-width: 420px) {
  .navlink {
    padding: 0.5rem 0.65rem;
    font-size: 0.8rem;
  }
  .brand-name {
    font-size: 1.05rem;
  }
  .site-header-inner {
    gap: 0.4rem;
  }
}
.navlink:hover {
  color: #fff;
}
.navlink-active {
  background: var(--accent);
  color: #000;
}
.btn.admin-link {
  display: none;
}
@media (min-width: 640px) {
  .btn.admin-link {
    display: inline-flex;
  }
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  border-radius: 999px;
  padding: 0.6rem 1.1rem;
  font-size: 0.875rem;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: 0.15s;
  white-space: nowrap;
}
.btn-solid {
  background: var(--accent);
  color: #000;
}
.btn-solid:hover {
  filter: brightness(0.95);
}
.btn-outline {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
}
.btn-outline:hover {
  background: rgba(255, 255, 255, 0.1);
}
.btn-ghost {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: rgba(255, 255, 255, 0.7);
}
.btn-ghost:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.3);
}
.btn-danger {
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.4);
  color: #fca5a5;
}
.btn-danger:hover {
  background: rgba(239, 68, 68, 0.22);
}
.btn-sm {
  padding: 0.35rem 0.75rem;
  font-size: 0.78rem;
}
.file-btn {
  cursor: pointer;
}

/* ---------------- Hero ---------------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 24px;
}
.hero-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 7;
  min-height: 220px;
}
.hero-img,
.hero-fallback {
  height: 100%;
  width: 100%;
  object-fit: cover;
}
.hero-fade-v {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, var(--bg), rgba(10, 11, 16, 0.5), transparent);
}
.hero-fade-h {
  position: absolute;
  inset: 0;
  background: linear-gradient(to right, rgba(10, 11, 16, 0.8), transparent 60%);
}
.hero-content {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 0.75rem;
  padding: 1.25rem;
}
@media (min-width: 640px) {
  .hero-media {
    min-height: 320px;
  }
  .hero-content {
    padding: 2.5rem;
  }
}
.live-tag {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.72rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent);
}
.dot-pulse {
  height: 7px;
  width: 7px;
  border-radius: 999px;
  background: #ef4444;
  animation: pulse 1.4s infinite;
  flex-shrink: 0;
}
@keyframes pulse {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}
.hero-title {
  max-width: 42rem;
  font-size: 1.6rem;
  font-weight: 900;
  line-height: 1.15;
  color: #fff;
  margin: 0;
}
.hero-desc {
  max-width: 34rem;
  font-size: 0.9rem;
  color: rgba(255, 255, 255, 0.65);
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
@media (min-width: 640px) {
  .hero-title {
    font-size: 2.4rem;
  }
  .hero-desc {
    font-size: 1rem;
  }
}
.hero-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 0.25rem;
}

/* ---------------- Sections / grid ---------------- */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 1rem;
}
.section-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: #fff;
  margin: 0;
}
.page-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: #fff;
  margin: 0 0 0.25rem;
}

.grid-controls {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}
@media (min-width: 640px) {
  .grid-controls {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
}
.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.pill {
  border-radius: 999px;
  padding: 0.4rem 1rem;
  font-size: 0.85rem;
  font-weight: 600;
  background: rgba(255, 255, 255, 0.05);
  color: rgba(255, 255, 255, 0.7);
  border: none;
  cursor: pointer;
  transition: 0.15s;
}
.pill:hover {
  background: rgba(255, 255, 255, 0.1);
}
.pill-active {
  background: var(--accent);
  color: #000;
}
.input {
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 0.55rem 1rem;
  font-size: 0.875rem;
  color: #fff;
  outline: none;
}
.input:focus {
  border-color: var(--accent);
}
textarea.input {
  border-radius: 14px;
  width: 100%;
  resize: vertical;
}
.search-input {
  width: 100%;
}
@media (min-width: 640px) {
  .search-input {
    width: 18rem;
  }
}

.channel-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
}
@media (min-width: 640px) {
  .channel-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media (min-width: 1024px) {
  .channel-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}
@media (min-width: 1280px) {
  .channel-grid {
    grid-template-columns: repeat(5, 1fr);
  }
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 16px;
  background: var(--bg-card);
  box-shadow: 0 0 0 1px var(--border);
  transition: transform 0.15s, box-shadow 0.15s;
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 0 2px var(--accent);
}
.card-media {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  background: #000;
}
.card-img {
  height: 100%;
  width: 100%;
  object-fit: cover;
  opacity: 0.9;
  transition: 0.25s;
}
.card:hover .card-img {
  transform: scale(1.05);
  opacity: 1;
}
.card-img-fallback {
  height: 100%;
  width: 100%;
  display: grid;
  place-items: center;
  font-size: 2.2rem;
}
.card-media-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.85), rgba(0, 0, 0, 0.1), transparent);
}
.card-badge-left {
  position: absolute;
  left: 8px;
  top: 8px;
  display: flex;
  align-items: center;
  gap: 4px;
  border-radius: 6px;
  background: rgba(0, 0, 0, 0.7);
  padding: 4px 8px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.03em;
  color: #fff;
  backdrop-filter: blur(4px);
}
.card-badge-right {
  position: absolute;
  right: 8px;
  top: 8px;
  display: grid;
  place-items: center;
  height: 28px;
  width: 28px;
  border-radius: 8px;
  background: rgba(0, 0, 0, 0.7);
  font-size: 0.9rem;
}
.card-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 4px;
  background: rgba(255, 255, 255, 0.2);
}
.card-progress-fill {
  height: 100%;
}
.card-info {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 2px;
  padding: 0.7rem;
}
.card-cat {
  margin: 0;
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: rgba(255, 255, 255, 0.4);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-name {
  margin: 0;
  font-size: 0.875rem;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-now {
  margin: 0;
  font-size: 0.78rem;
  color: rgba(255, 255, 255, 0.6);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-now-muted {
  color: rgba(255, 255, 255, 0.35);
}
.card-remaining {
  margin: 0;
  font-size: 0.7rem;
  color: rgba(255, 255, 255, 0.35);

}

}
